name: Deploy to Cloudflare

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      # dist/server/wrangler.json is generated by the build for local preview only
      # (npm start); it's missing the production worker name and nodejs_compat,
      # which the already-deployed "habittracker" worker requires.
      - name: Patch generated wrangler config for the live worker
        run: |
          node -e '
            const fs = require("fs");
            const path = "dist/server/wrangler.json";
            const cfg = JSON.parse(fs.readFileSync(path, "utf8"));
            cfg.name = "habittracker";
            cfg.topLevelName = "habittracker";
            cfg.compatibility_flags = ["nodejs_compat"];
            fs.writeFileSync(path, JSON.stringify(cfg));
          '

      # Apply schema changes to the same D1 database bound to the generated
      # production config. Wrangler tracks applied migration files, so this is
      # safe to run on every production deployment.
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply site-creator-d1 --remote --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - run: npx wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
